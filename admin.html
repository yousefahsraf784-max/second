<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الكافيه</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body data-page="admin"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M9 18h25v13a9 9 0 0 1-9 9h-7a9 9 0 0 1-9-9V18Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M34 21h3a5 5 0 0 1 0 10h-4M15 8c-2 3 2 4 0 7m9-9c-2 3 2 4 0 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M5 43h34" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span><span><b class="cafe-name">كافيه</b><small>لوحة الإدارة</small></span></a><div class="header-actions"><button class="lang-toggle" type="button" data-language-toggle>English</button><a class="cart-link" href="index.html">عرض المتجر ↗</a></div></header><main class="admin-main"><section id="login-panel" class="login-card"><span class="eyebrow">مساحة الإدارة</span><h1>أهلاً بعودتك</h1><p class="muted">سجّل دخولك لإدارة المنتجات والطلبات.</p><form id="login-form"><label>البريد الإلكتروني<input name="email" type="email" required placeholder="admin@example.com"></label><label>كلمة المرور<input name="password" type="password" required></label><button class="primary-btn full">تسجيل الدخول</button><p id="login-feedback" class="form-feedback"></p></form></section><div id="dashboard" hidden><div class="admin-heading"><div><span class="eyebrow">نظرة عامة</span><h1>إدارة الكافيه</h1></div><button id="logout-btn" class="soft-btn">تسجيل الخروج</button></div><div class="admin-tabs"><button class="tab active" data-tab="orders">الطلبات</button><button class="tab" data-tab="products-admin">المنتجات</button></div><section id="orders" class="admin-view"><div class="section-head"><h2>الطلبات الواردة</h2><button id="refresh-orders" class="soft-btn">تحديث</button></div><div id="orders-list" class="orders-list">جاري تحميل الطلبات...</div></section><section id="products-admin" class="admin-view" hidden><div class="section-head"><h2>إضافة منتج جديد</h2></div><form id="product-form" class="product-form"><label>اسم المنتج بالعربي<input name="name_ar" required placeholder="مثلاً: لاتيه مثلج"></label><label>اسم المنتج بالإنجليزي<input name="name_en" required placeholder="e.g. Iced Latte" dir="ltr"></label><label>السعر (جنيه مصري)<input name="price" type="number" min="0.01" step="0.01" required placeholder="75" dir="ltr"></label><label>التصنيف بالعربي<input name="category_ar" required placeholder="مثلاً: مشروبات"></label><label>التصنيف بالإنجليزي<input name="category_en" required placeholder="e.g. Drinks" dir="ltr"></label><label>صورة المنتج من جهازك<input name="image_file" type="file" accept="image/*"><small class="field-hint">اختار صورة من الموبايل أو الكمبيوتر</small></label><label class="wide">وصف بسيط<textarea name="description" rows="2" placeholder="وصف المنتج"></textarea></label><button class="primary-btn">إضافة المنتج</button><p id="product-feedback" class="form-feedback wide"></p></form><h2 class="subheading">المنتجات الحالية</h2><div id="admin-products" class="admin-product-list"></div></section></div></main><footer><span>لوحة إدارة الكافيه</span><a href="index.html">العودة للمتجر</a></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js?v=20261121-4"></script></body></html>
