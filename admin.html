<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الكافيه</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body data-page="admin"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">☕</span><span><b class="cafe-name">كافيه</b><small>لوحة الإدارة</small></span></a><div class="header-actions"><button class="lang-toggle" type="button" data-language-toggle>English</button><a class="cart-link" href="index.html">عرض المتجر ↗</a></div></header><main class="admin-main"><section id="login-panel" class="login-card"><span class="eyebrow">مساحة الإدارة</span><h1>أهلاً بعودتك</h1><p class="muted">سجّل دخولك لإدارة المنتجات والطلبات.</p><form id="login-form"><label>البريد الإلكتروني<input name="email" type="email" required placeholder="admin@example.com"></label><label>كلمة المرور<input name="password" type="password" required></label><button class="primary-btn full">تسجيل الدخول</button><p id="login-feedback" class="form-feedback"></p></form></section><div id="dashboard" hidden><div class="admin-heading"><div><span class="eyebrow">نظرة عامة</span><h1>إدارة الكافيه</h1></div><button id="logout-btn" class="soft-btn">تسجيل الخروج</button></div><div class="admin-tabs"><button class="tab active" data-tab="orders">الطلبات</button><button class="tab" data-tab="products-admin">المنتجات</button></div><section id="orders" class="admin-view"><div class="section-head"><h2>الطلبات الواردة</h2><button id="refresh-orders" class="soft-btn">تحديث</button></div><div id="orders-list" class="orders-list">جاري تحميل الطلبات...</div></section><section id="products-admin" class="admin-view" hidden><div class="section-head"><h2>إضافة منتج جديد</h2></div><form id="product-form" class="product-form"><label>اسم المنتج<input name="name" required placeholder="مثلاً: آيس لاتيه"></label><label>السعر بالجنيه<input name="price" type="number" min="1" step="0.5" required placeholder="75"></label><label>التصنيف<input name="category" required placeholder="قهوة / حلويات / مشروبات"></label><label>صورة المنتج من جهازك<input name="image_file" type="file" accept="image/*"><small class="field-hint">اختار صورة من الموبايل أو الكمبيوتر</small></label><label class="wide">وصف بسيط<textarea name="description" rows="2" placeholder="وصف المنتج"></textarea></label><button class="primary-btn">إضافة المنتج</button><p id="product-feedback" class="form-feedback wide"></p></form><h2 class="subheading">المنتجات الحالية</h2><div id="admin-products" class="admin-product-list"></div></section></div></main><footer><span>لوحة إدارة الكافيه</span><a href="index.html">العودة للمتجر</a></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
